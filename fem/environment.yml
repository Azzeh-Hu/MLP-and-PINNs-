# conda env create -f environment.yml && conda activate fenicsx-niti
# Versions used to produce results/fem (Nov 2026).
name: fenicsx-niti
channels:
  - conda-forge
dependencies:
  - python=3.12
  - fenics-dolfinx=0.11.0
  - petsc=3.25.6=*real*     # real-valued PETSc build
  - mumps-mpi               # pivoting LU used by core/solver.py
  - mpich
  - numpy
  - matplotlib
